<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colombia — An Epic History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--ink:#f4e8c8;--gold:#f2c14e;--muted:#b9ad90;--panel:rgba(8,10,18,.82);--line:rgba(242,193,78,.35)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Montserrat,system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block;background:#000}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.85));z-index:5;padding:16px;box-sizing:border-box}
  .card{max-width:640px;width:100%;text-align:center;padding:36px 28px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px)}
  .kicker{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(40px,9vw,84px);letter-spacing:.12em;margin:.25em 0 .1em;background:linear-gradient(#fff6d0,#f5c850 45%,#b97d1c 72%,#ffe39a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0 0 22px;color:var(--muted);font-weight:300;letter-spacing:.04em}
  #status{font-size:13px;color:var(--muted);margin-bottom:18px;min-height:34px}
  .bar{height:3px;background:rgba(255,255,255,.1);margin-top:8px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FCD116,#003893,#CE1126);transition:width .2s}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{font:600 14px Montserrat,sans-serif;letter-spacing:.08em;padding:12px 20px;border:1px solid var(--gold);background:var(--gold);color:#1a1204;cursor:pointer}
  button.ghost{background:transparent;color:var(--gold)}
  button:disabled{opacity:.35;cursor:default}
  .hint{font-size:12px;color:#8c826c;margin:18px 0 0}
  #controls{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.8));transition:opacity .4s;opacity:0}
  #controls.show{opacity:1}
  #controls button{padding:8px 12px;font-size:12px}
  #seek{flex:1;accent-color:#f2c14e}
  #time{font:600 12px Montserrat;color:var(--ink);min-width:92px;text-align:center}
  #rec-badge{position:fixed;top:14px;right:16px;z-index:6;display:none;font:700 12px Montserrat;letter-spacing:.2em;color:#fff;background:#c0121f;padding:6px 10px}
  #rec-badge.on{display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>

<div id="intro" class="overlay">
  <div class="card">
    <div class="kicker">Motion graphics · Original orchestral score · 5:00</div>
    <h1>COLOMBIA</h1>
    <p class="sub">An epic history, from El Dorado to 2026</p>
    <div id="status">Composing the orchestral score… <span id="pct">0%</span><div class="bar"><i id="barfill"></i></div></div>
    <div class="btns">
      <button id="play" disabled>▶ Play</button>
      <button id="rec" class="ghost" disabled title="Plays the film once in real time and saves it as a video file">● Record video</button>
      <button id="wav" class="ghost" disabled>⤓ Soundtrack (WAV)</button>
    </div>
    <p class="hint">Best in fullscreen (F) with headphones · Space pause · ←/→ seek 5s</p>
  </div>
</div>

<div id="controls">
  <button id="pp">❚❚</button>
  <span id="time">0:00 / 5:00</span>
  <input id="seek" type="range" min="0" max="300" step="0.05" value="0">
  <button id="fs">⛶ Fullscreen</button>
</div>
<div id="rec-badge">● REC — keep this tab visible</div>

<script>
// =====================================================================
//  CONSTANTS & UTILITIES
// =====================================================================
const W = 1920, H = 1080, BPM = 96, BEAT = 60 / BPM, BAR = BEAT * 4; // one bar = 2.5 s
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GOLD = '#f2c14e', GOLD2 = '#ffe08a', YEL = '#FCD116', BLU = '#003893', RED = '#CE1126';

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo3 = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eoexp = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eoback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const win = (t, a, b, f = .5) => clamp((t - a) / f) * clamp((b - t) / f);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

// Scene alpha (for crossfades) — every draw goes through A()
let SA = 1;
function A(a = 1) { ctx.globalAlpha = clamp(SA * a); }

// ---------- text ----------
function setFont(o) { ctx.font = `${o.style || ''} ${o.weight || 400} ${o.size || 40}px ${o.font === 'Cinzel' ? "'Cinzel', 'Times New Roman', serif" : "'Montserrat', 'Segoe UI', sans-serif"}`; }
function txt(s, x, y, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); A(a); setFont(o);
  const al = o.align || 'center'; ctx.textAlign = al; ctx.textBaseline = 'middle';
  const sp = o.spacing || 0; if ('letterSpacing' in ctx) ctx.letterSpacing = sp + 'px';
  let xx = x; if (al === 'center') xx += sp / 2;
  if (o.glow) { ctx.shadowColor = o.glowColor || 'rgba(0,0,0,.6)'; ctx.shadowBlur = o.glow; }
  ctx.fillStyle = o.fill || o.color || '#fff';
  ctx.fillText(s, xx, y);
  ctx.restore();
}
function measure(s, o) { ctx.save(); setFont(o); if ('letterSpacing' in ctx) ctx.letterSpacing = (o.spacing || 0) + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function wipe(s, x, y, p, o) {
  if (p <= 0) return;
  const w = measure(s, o), al = o.align || 'center';
  const x0 = al === 'left' ? x : al === 'right' ? x - w : x - w / 2;
  const e = eo3(p);
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 30, y - o.size * 1.3, (w + 60) * e, o.size * 2.6); ctx.clip();
  txt(s, x, y, { ...o, alpha: (o.alpha ?? 1) * clamp(p * 3) });
  ctx.restore();
  if (p < 1) { A((o.alpha ?? 1) * .9 * (1 - p)); ctx.fillStyle = o.edge || GOLD2; ctx.fillRect(x0 - 30 + (w + 60) * e, y - o.size * .6, 3, o.size * 1.2); }
}
function revealTxt(s, x, y, p, o) {
  if (p <= 0) return;
  const chars = [...s];
  ctx.save(); setFont(o); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  const ws = chars.map(c => ctx.measureText(c).width), sp = o.spacing || 0;
  const tot = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let cx = x - tot / 2; const n = chars.length;
  if (o.glow) { ctx.shadowColor = o.glowColor || 'rgba(255,200,80,.8)'; ctx.shadowBlur = o.glow; }
  ctx.fillStyle = o.fill || '#fff';
  for (let i = 0; i < n; i++) {
    const st = n > 1 ? .6 * i / (n - 1) : 0;
    const e = eo3(clamp((p - st) / .4));
    if (e > 0) { ctx.globalAlpha = clamp(SA * (o.alpha ?? 1) * e); ctx.fillText(chars[i], cx, y + (1 - e) * o.size * .35); }
    cx += ws[i] + sp;
  }
  ctx.restore();
}

// ---------- shapes ----------
function goldGrad(y0, y1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#fff6d0'); g.addColorStop(.45, '#f5c850'); g.addColorStop(.72, '#b97d1c'); g.addColorStop(1, '#ffe39a'); return g; }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rect(x, y, w, h, style, a = 1) { A(a); ctx.fillStyle = style; ctx.fillRect(x, y, w, h); }
function bgRadial(c1, c2, cx = 960, cy = 540, r = 1250) { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, c1); g.addColorStop(1, c2); rect(0, 0, W, H, g); }
function glow(x, y, r, rgb, a) {
  if (a <= 0 || r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.4, `rgba(${rgb},${a * .35})`); g.addColorStop(1, `rgba(${rgb},0)`);
  A(1); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function circle(x, y, r, style, a = 1) { A(a); ctx.fillStyle = style; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function ring(x, y, r, style, lw, a) { if (a <= 0) return; A(a); ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.stroke(); }
function rays(cx, cy, rot, n, rgb, a, len = 1700, width = .4) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, len);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  A(1); ctx.fillStyle = g; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a0 = rot + i * Math.PI * 2 / n, a1 = a0 + Math.PI * 2 / n * width;
    ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a0) * len, cy + Math.sin(a0) * len); ctx.lineTo(cx + Math.cos(a1) * len, cy + Math.sin(a1) * len); ctx.closePath();
  }
  ctx.fill();
}
function tricolor(cx, y, w, h, a = 1) {
  if (w <= 0) return; A(a); const x0 = cx - w / 2;
  ctx.fillStyle = YEL; ctx.fillRect(x0, y, w / 2, h);
  ctx.fillStyle = BLU; ctx.fillRect(x0 + w / 2, y, w / 4, h);
  ctx.fillStyle = RED; ctx.fillRect(x0 + w * .75, y, w / 4, h);
}
function ridgeY(x, seed, amp) {
  return amp * (.55 * (1 - Math.abs(Math.sin(x * .0021 + seed * 1.3))) + .3 * (1 - Math.abs(Math.sin(x * .0053 + seed * 2.7))) + .15 * (1 - Math.abs(Math.sin(x * .013 + seed * 5.1))));
}
function ridgeLayer(base, amp, seed, fill, scroll = 0, a = 1) {
  A(a); ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, base - ridgeY(x + scroll, seed, amp));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function hillY(x, base, amp, f, ph) { return base - amp * (.5 + .5 * Math.sin(x * f + ph)) - amp * .35 * Math.sin(x * f * 2.3 + ph * 1.7); }
function hillLayer(base, amp, f, ph, col) {
  A(1); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, hillY(x, base, amp, f, ph));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function stars(t, a, maxY = 560) {
  if (a <= 0) return;
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 160; i++) {
    const x = hash(i) * W, y = hash(i + .31) * maxY, tw = .4 + .6 * Math.abs(Math.sin(t * (1 + hash(i + 2) * 2) + i));
    A(a * tw * (.3 + .7 * hash(i + 5))); ctx.fillRect(x, y, 1.6 + hash(i + 7) * 1.6, 1.6 + hash(i + 7) * 1.6);
  }
}
function rain(t, a, n = 280, slant = .22, speed = 1500) {
  if (a <= 0) return;
  A(a); ctx.strokeStyle = 'rgb(200,214,235)'; ctx.lineWidth = 1.3; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const L = 18 + hash(i + 503) * 26, sp = speed * (.8 + hash(i + 502) * .4);
    const y = ((hash(i + 501) * (H + 60) + t * sp) % (H + 60)) - 30, x = ((hash(i + 500) * (W + 300) + t * sp * slant) % (W + 300)) - 150;
    ctx.moveTo(x, y); ctx.lineTo(x - L * slant, y - L);
  }
  ctx.stroke();
}
function candle(x, y, s, t, seed) {
  const f = .85 + .15 * Math.sin(t * 13 + seed * 7) * Math.sin(t * 7.3 + seed);
  glow(x, y - 52 * s, 70 * s * f, '255,180,80', .5);
  rect(x - 6 * s, y - 42 * s, 12 * s, 42 * s, '#e9dfc9', 1);
  A(1); ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.ellipse(x + Math.sin(t * 9 + seed) * 1.2 * s, y - 52 * s, 3.6 * s, 10 * s * f, 0, 0, Math.PI * 2); ctx.fill();
  A(.9); ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.ellipse(x, y - 49 * s, 1.6 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
}
function smokeColumn(x, base, t, seed, sc, rgb, a) {
  for (let k = 0; k < 12; k++) {
    const age = (t * .1 + k / 12 + hash(seed + k) * .04) % 1, y = base - age * 620 * sc, xx = x + Math.sin(age * 5 + seed) * 40 * sc * age + age * 160 * sc;
    glow(xx, y, (40 + age * 240) * sc, rgb, a * (1 - age) * .75);
  }
}
function firework(cx, cy, d, rgb, seed) {
  if (d < 0 || d > 2.4) return;
  ctx.globalCompositeOperation = 'lighter';
  glow(cx, cy, 260, rgb, .45 * Math.max(0, 1 - d * 1.6));
  for (let i = 0; i < 46; i++) {
    const an = i / 46 * Math.PI * 2 + hash(seed + i) * .2, sp = 280 * (.65 + hash(seed + i + 1) * .5), r = sp * (1 - Math.exp(-d * 2.4));
    circle(cx + Math.cos(an) * r, cy + Math.sin(an) * r + 55 * d * d, 2.8 * (1 - d / 2.4) + .6, `rgb(${rgb})`, 1 - d / 2.4);
  }
  ctx.globalCompositeOperation = 'source-over';
}
function searchlight(x, y, ang, len, a) {
  const g = ctx.createLinearGradient(x, y, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
  g.addColorStop(0, `rgba(230,240,255,${a})`); g.addColorStop(1, 'rgba(230,240,255,0)');
  A(1); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 8, y);
  ctx.lineTo(x + Math.cos(ang - .07) * len, y + Math.sin(ang - .07) * len); ctx.lineTo(x + Math.cos(ang + .07) * len, y + Math.sin(ang + .07) * len); ctx.lineTo(x + 8, y); ctx.fill();
}
function rose(x, y, s, rot, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); A(a);
  ctx.strokeStyle = '#2e5a2e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, 60, 0, 130); ctx.stroke();
  ctx.fillStyle = '#3d7a3d'; ctx.beginPath(); ctx.ellipse(12, 62, 15, 6, .6, 0, Math.PI * 2); ctx.fill();
  for (let k = 0; k < 7; k++) { const a2 = k / 7 * Math.PI * 2; ctx.fillStyle = k % 2 ? '#f4f1ea' : '#ddd7cb'; ctx.beginPath(); ctx.ellipse(Math.cos(a2) * 9, -6 + Math.sin(a2) * 6, 15, 10, a2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#fffdf7'; ctx.beginPath(); ctx.ellipse(0, -12, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// silhouette crowd; options: umbrellas, flags, bob, n
function crowd(y, t, seed, col, o = {}) {
  const n = o.n || 46;
  for (let i = 0; i < n; i++) {
    const x = (i + .5) / n * (W + 120) - 60 + (hash(seed + i) - .5) * 26;
    const hy = y - hash(seed + i + .3) * 40 + Math.sin(t * 2.4 + i) * (o.bob || 0);
    A(1); ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, hy, 14 + hash(i + seed) * 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, hy + 52, 30, 36, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(x - 30, hy + 52, 60, H - hy);
    if (o.umbrellas && hash(seed + i + 9) > .4) { ctx.beginPath(); ctx.arc(x + 6, hy - 22, 40, Math.PI, 0); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 6, hy - 22); ctx.lineTo(x + 6, hy + 20); ctx.stroke(); }
    if (o.flags && hash(seed + i + 7) > .55) {
      const px = x + 16, top = hy - 120 - hash(i + 3) * 40;
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, hy + 30); ctx.lineTo(px, top); ctx.stroke();
      [[YEL, 0, 22], [BLU, 22, 11], [RED, 33, 11]].forEach(([c, oo, h]) => {
        ctx.fillStyle = c; ctx.beginPath();
        for (let k = 0; k <= 8; k++) { const q = k / 8; ctx.lineTo(px + q * 64, top + oo + Math.sin(t * 6 + q * 4 + i) * 6 * q); }
        for (let k = 8; k >= 0; k--) { const q = k / 8; ctx.lineTo(px + q * 64, top + oo + h + Math.sin(t * 6 + q * 4 + i) * 6 * q); }
        ctx.fill();
      });
    }
  }
}
// neoclassical colonnade (Capitolio Nacional style)
function colonnade(cx, base, w, h, col, lit, a = 1) {
  const top = base - h, n = 14, cw = w / n;
  if (lit) { const g = ctx.createLinearGradient(0, top, 0, base); g.addColorStop(0, `rgba(${lit},.25)`); g.addColorStop(1, `rgba(${lit},.7)`); rect(cx - w / 2, top + h * .15, w, h * .85, g, a); }
  A(a); ctx.fillStyle = col;
  ctx.fillRect(cx - w / 2 - 40, base - 18, w + 80, 18); ctx.fillRect(cx - w / 2 - 20, base - 32, w + 40, 14);
  ctx.fillRect(cx - w / 2, top, w, h * .15); ctx.fillRect(cx - w / 2 - 12, top - 14, w + 24, 14);
  for (let i = 0; i < n; i++) { const x = cx - w / 2 + i * cw + cw * .22; ctx.fillRect(x, top + h * .15, cw * .5, h * .85 - 32); ctx.fillRect(x - cw * .08, top + h * .15, cw * .66, 10); ctx.fillRect(x - cw * .08, base - 44, cw * .66, 12); }
}

// ---------- Colombia & Panama (stylised outlines, lon/lat) ----------
const COL = [[-71.67, 12.46], [-71.32, 11.85], [-72.25, 11.15], [-72.9, 10.45], [-73.05, 9.3], [-72.75, 8.75], [-72.45, 8.2], [-72.4, 7.4], [-71.2, 7.0], [-70.1, 6.97], [-69.4, 6.1], [-67.85, 6.3], [-67.5, 5.2], [-67.8, 4.2], [-67.4, 3.3], [-67.6, 2.8], [-67.3, 2.0], [-66.87, 1.22], [-67.9, 1.5], [-69.8, 1.7], [-69.85, 1.07], [-69.2, .6], [-70.05, .55], [-70.05, -.15], [-69.45, -1.1], [-69.95, -4.22], [-70.7, -3.8], [-70.05, -2.7], [-70.9, -2.2], [-72.0, -2.4], [-73.2, -1.8], [-73.6, -1.2], [-74.8, -.2], [-75.3, -.1], [-75.8, .1], [-76.4, .4], [-77.4, .4], [-77.7, .85], [-78.85, 1.45], [-78.7, 1.8], [-78.4, 2.6], [-77.9, 2.7], [-77.4, 3.6], [-77.1, 3.9], [-77.4, 4.3], [-77.3, 5.6], [-77.5, 6.6], [-77.9, 7.2], [-77.3, 7.9], [-77.36, 8.67], [-76.95, 8.3], [-76.85, 7.95], [-76.73, 8.1], [-76.4, 8.9], [-75.8, 9.4], [-75.6, 9.6], [-75.55, 10.4], [-75.2, 10.8], [-74.8, 11.05], [-74.2, 11.25], [-73.3, 11.3], [-72.9, 11.55], [-72.2, 11.9], [-71.95, 12.2]];
const PAN = [[-77.36, 8.67], [-77.9, 9.1], [-78.9, 9.45], [-79.6, 9.55], [-80.5, 9.1], [-81.3, 8.8], [-82.2, 9.0], [-82.9, 9.4], [-82.9, 8.2], [-81.7, 7.6], [-80.9, 7.2], [-80.2, 7.4], [-80.4, 8.1], [-79.6, 8.95], [-78.9, 8.6], [-78.3, 8.2], [-77.9, 7.2], [-77.3, 7.9]];
const mp = (lo, la, cx, cy, sc) => [cx + (lo + 73) * sc, cy - (la - 4.2) * sc];
function polyPath(poly, cx, cy, sc) { ctx.beginPath(); poly.forEach(([lo, la], i) => { const [x, y] = mp(lo, la, cx, cy, sc); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); }
function drawMap(cx, cy, sc, o) {
  const pts = COL.map(([lo, la]) => mp(lo, la, cx, cy, sc));

  let bass = (t, d, m, v) => { const f = mtof(m), g = gainNode(B.bass), end = adsr(g, t, .015, v * .3, d, .15), lp = filt('lowpass', 420, .8, g); osc('sawtooth', f, t, end + .05, lp); osc('sine', f, t, end + .05, gainNode(g, .8)); };
  let taiko = (t, v) => { const g = gainNode(B.drums); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .004); g.gain.exponentialRampToValueAtTime(.001, t + 1); const o = oc.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(52, t + .16); o.connect(g); o.start(t); o.stop(t + 1.05); const ng = gainNode(B.drums); ng.gain.setValueAtTime(v * .55, t); ng.gain.exponentialRampToValueAtTime(.001, t + .14); noiseSrc(t, .16, filt('lowpass', 1100, .7, ng)); };
  let tom = (t, v, f = 160) => { const g = gainNode(B.drums); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * .6, t + .004); g.gain.exponentialRampToValueAtTime(.001, t + .45); const o = oc.createOscillator(); o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f, t + .08); o.connect(g); o.start(t); o.stop(t + .5); };
  let snare = (t, v) => { const ng = gainNode(B.drums); ng.gain.setValueAtTime(v * .4, t); ng.gain.exponentialRampToValueAtTime(.001, t + .2); noiseSrc(t, .22, filt('bandpass', 2400, .8, ng)); const g = gainNode(B.drums); g.gain.setValueAtTime(v * .3, t); g.gain.exponentialRampToValueAtTime(.001, t + .09); osc('triangle', 190, t, t + .1, g); };
  let crash = (t, v) => { const g = gainNode(B.fx); g.gain.setValueAtTime(v * .28, t); g.gain.exponentialRampToValueAtTime(.001, t + 3.2); noiseSrc(t, 3.3, filt('highpass', 3800, .6, g)); };
  let swell = (tEnd, dur, v) => { const t = tEnd - dur, g = gainNode(B.fx); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v * .3, tEnd - .02); g.gain.linearRampToValueAtTime(0, tEnd + .02); const hp = filt('highpass', 500, .7, g); hp.frequency.setValueAtTime(500, t); hp.frequency.exponentialRampToValueAtTime(6000, tEnd); noiseSrc(t, dur + .05, hp); const g2 = gainNode(B.fx); g2.gain.setValueAtTime(.0001, t); g2.gain.exponentialRampToValueAtTime(v * .05, tEnd - .02); g2.gain.linearRampToValueAtTime(0, tEnd + .02); const o = osc('sawtooth', 110, t, tEnd + .05, filt('lowpass', 2000, 1, g2)); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, tEnd); };
  let boom = (t, v) => { const g = gainNode(B.bass); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * .9, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + 2.6); const o = oc.createOscillator(); o.frequency.setValueAtTime(75, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.6); o.connect(g); o.start(t); o.stop(t + 2.7); taiko(t, v); crash(t, v * .8); };
  let braam = (t, d, m, v) => { const g = gainNode(B.brass), end = adsr(g, t, .06, v * .09, d, 1.4), lp = filt('lowpass', 150, 2, g); lp.frequency.setValueAtTime(150, t); lp.frequency.exponentialRampToValueAtTime(2400, t + .35); lp.frequency.exponentialRampToValueAtTime(380, t + d); for (const mm of [m - 12, m, m + 7]) for (const dt of [-12, 0, 12]) osc('sawtooth', mtof(mm), t, end + .05, lp, dt); };

  // Lazy scheduling: notes are queued, then built just before they sound (via suspend),
  // so the graph only ever holds a few seconds of nodes instead of the whole film.
  const Q = []; let direct = false;
  const lazy = (fn, isSwell = false) => (...a) => { if (direct) return fn(...a); Q.push([isSwell ? a[0] - a[1] : a[0], () => fn(...a)]); };
  strings = lazy(strings); brass = lazy(brass); horn = lazy(horn); choir = lazy(choir); flute = lazy(flute); pluck = lazy(pluck);
  ost = lazy(ost); bass = lazy(bass); taiko = lazy(taiko); tom = lazy(tom); snare = lazy(snare); crash = lazy(crash);
  swell = lazy(swell, true); boom = lazy(boom); braam = lazy(braam);
  const strLead = (t, d, m, v) => strings(t, d, m, v * 1.5, B.strR, .15);

  // ---- bar-level helpers (M) used by each scene's music ----
  const T = b => b * BAR;
  const M = {
    T, R: (a, n, f) => { for (let i = 0; i < n; i++) f(a + i, i); },
    pad: (b, v, bars = 1) => { const vo = voicing(PROG[b], 55); let low = CH[PROG[b]][0]; while (low < 45) low += 12; vo.forEach((m, i) => strings(T(b), BAR * bars, m, v, i % 2 ? B.strR : B.str)); strings(T(b), BAR * bars, low, v * .8); },
    choir: (b, v, bars = 1) => voicing(PROG[b], 57).forEach(m => choir(T(b), BAR * bars, m, v)),
    brass: (b, v) => voicing(PROG[b], 50).forEach(m => { brass(T(b), BEAT * 1.4, m, v); brass(T(b) + BEAT * 2.5, BEAT * 1.3, m, v * .9); }),
    brassNote: (t, d, m, v) => brass(t, d, m, v),
    pluck: (b, v) => { const vo = voicing(PROG[b], 62), arr = [vo[0], vo[1], vo[2], vo[0] + 12]; [0, 1, 2, 3, 2, 1, 2, 1].forEach((k, i) => pluck(T(b) + i * BAR / 8, arr[k], v * (i % 2 ? .75 : 1))); },
    ost: (b, kind, v) => { const [r, iv] = CH[PROG[b]]; let root = r; while (root < 50) root += 12; const tones = [root, root + iv[1], root + iv[2], root + 12]; const n = kind === '16th' ? 16 : 8, pat = n === 16 ? [0, 2, 3, 2, 0, 2, 3, 2, 0, 2, 3, 2, 1, 2, 3, 2] : [0, 2, 3, 2, 1, 2, 3, 2]; for (let i = 0; i < n; i++) ost(T(b) + i * BAR / n, tones[pat[i]], v * (i % (n / 4) === 0 ? 1.25 : .85), i % 2 ? B.ostR : B.ostL); },
    bass: (b, kind, v, bars = 1) => { let m = CH[PROG[b]][0]; while (m > 45) m -= 12; while (m < 34) m += 12; if (kind === 'drone') bass(T(b), BAR * bars - .05, m, v); else for (let i = 0; i < 8; i++) bass(T(b) + i * BAR / 8, BAR / 8 * .7, i === 7 ? m + 12 : m, v * (i % 2 ? .8 : 1)); },
    drum: (b, kind, v) => {
      const t = T(b), e = BAR / 8, s = BAR / 16;

      if (kind === 'half') { taiko(t, v); taiko(t + 4 * e, v * .75); tom(t + 7 * e, v * .4, 120); }
      if (kind === 'epic') { [[0, 1], [3, .6], [4, .85], [6, .7], [7, .55]].forEach(([i, a]) => taiko(t + i * e, v * a)); snare(t + 2 * e, v * .35); snare(t + 6 * e, v * .35); if (b % 2) [12, 13, 14, 15].forEach((i, k) => tom(t + i * s, v * (.3 + k * .1), [180, 160, 140, 120][k])); }

  Q.sort((a, b) => a[0] - b[0]); let qi = 0, LIVE = [];

function toWav(buf) {
  const n = buf.length, ch = buf.numberOfChannels, sr = buf.sampleRate, bytes = n * ch * 2, ab = new ArrayBuffer(44 + bytes), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }

// =====================================================================
//  PLAYER
// =====================================================================
const $ = id => document.getElementById(id);
let actx = null, score = null, src = null, t0 = 0, pausedAt = 0, playing = false, recDest = null, recorder = null, token = 0;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function now() { return playing ? actx.currentTime - t0 : pausedAt; }

}
function pause() { if (!playing) return; pausedAt = now(); playing = false; token++; stopSrc(); $('pp').textContent = '▶'; }
function finish() {
  playing = false; pausedAt = DUR; stopSrc(); $('pp').textContent = '↺';

}
function seek(tt) { tt = clamp(tt, 0, DUR - .01); if (playing) playFrom(tt); else pausedAt = tt; }
function loop() {
  const t = now();

  $('time').textContent = `${fmt(t)} / ${fmt(DUR)}`;
  if (document.activeElement !== $('seek')) $('seek').value = t;
  if (playing && t >= DUR) finish();
  requestAnimationFrame(loop);
}

$('play').onclick = () => { $('intro').style.display = 'none'; playFrom(0); showControls(); };
$('wav').onclick = () => download(toWav(score), 'Colombia-Epic-History-Soundtrack.wav');
$('rec').onclick = () => {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  recDest = actx.createMediaStreamDestination();
  const stream = cv.captureStream(60); stream.addTrack(recDest.stream.getAudioTracks()[0]);
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));

  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => { $('rec-badge').classList.remove('on'); recDest = null; download(new Blob(chunks, { type: mime.split(';')[0] }), 'Colombia-Epic-History.' + (mime.startsWith('video/mp4') ? 'mp4' : 'webm')); };
  $('intro').style.display = 'none'; $('rec-badge').classList.add('on');
  render(0); recorder.start(1000); playFrom(0);
};
$('pp').onclick = () => { if (playing) pause(); else playFrom(pausedAt >= DUR ? 0 : pausedAt); };
$('seek').oninput = e => { if (!recorder || recorder.state !== 'recording') seek(+e.target.value); };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
let hideT; function showControls() { if ($('intro').style.display !== 'none') return; $('controls').classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => playing && $('controls').classList.remove('show'), 2500); }
addEventListener('mousemove', showControls);
addEventListener('keydown', e => {
  if (!score || $('intro').style.display !== 'none') return;
  if (recorder && recorder.state === 'recording') return;
  if (e.code === 'Space') { e.preventDefault(); $('pp').click(); }
  if (e.code === 'ArrowRight') seek(now() + 5);
  if (e.code === 'ArrowLeft') seek(now() - 5);
  if (e.code === 'KeyF') $('fs').click();
  showControls();
});

// boot
(async () => {
  try { await Promise.race([Promise.all(['900 100px Cinzel', '700 100px Cinzel', '400 20px Montserrat', '700 20px Montserrat', '800 20px Montserrat', '300 20px Montserrat', '600 20px Montserrat', 'italic 300 20px Montserrat'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 4000))]); } catch (e) { }
  const qt = parseFloat(new URLSearchParams(location.search).get('t'));
  pausedAt = isNaN(qt) ? 5.2 : qt;
  if (!isNaN(qt)) { $('intro').style.display = 'none'; render(qt); } // ?t=SECONDS opens a still preview of that moment
  requestAnimationFrame(loop);
  const t1 = performance.now();
  score = await composeScore(p => { $('pct').textContent = Math.round(p * 100) + '%'; $('barfill').style.width = (p * 100) + '%'; });
  window.__score = score;
  $('status').innerHTML = `Score ready (${((performance.now() - t1) / 1000).toFixed(1)} s to compose)`;
  if (isNaN(qt)) pausedAt = 0; else { $('intro').style.display = ''; }
  ['play', 'rec', 'wav'].forEach(id => $(id).disabled = false);
})();
